[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-ocr-toolkit"
version = "0.1.0"
description = "A pluggable PDF OCR toolkit that turns scanned business documents into structured Excel/CSV data."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Yin Jing"},
]
keywords = ["pdf", "ocr", "invoice", "parser", "excel", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "pdfplumber>=0.10.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
    "celery>=5.3.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "pdf2image>=1.16.0",
]
paddle = [
    "paddleocr>=2.7.0",
    "Pillow>=10.0.0",
]
dev = [
    "pytest>=7.4.0",
    "reportlab>=4.0.0",
    "httpx>=0.25.0",
]

[project.scripts]
pdf-ocr = "pdf_ocr_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
